# nginx for the https devnet (docker-compose.https.yml). One leaf certificate names
# every host below; data/https/ca.crt is the CA that signed it (scripts/https-ca.sh).
# Mounted as conf.d/default.conf, so this is the http block's whole server list.

# Docker's embedded DNS, re-asked every 10 s, so a recreated container's new
# address is picked up without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

ssl_certificate     /etc/nginx/https/leaf.crt;
ssl_certificate_key /etc/nginx/https/leaf.key;
ssl_protocols       TLSv1.2 TLSv1.3;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Firehose and event-stream websockets stay open.
proxy_read_timeout 1h;
proxy_send_timeout 1h;
# Blob uploads.
client_max_body_size 100m;

# A name this file does not list gets no certificate at all.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

# The PDS, and every handle under its service domain: the PDS answers
# /.well-known/atproto-did by Host, so Host is passed through as sent.
server {
    listen 443 ssl;
    server_name pds.https.devnet.test *.https.devnet.test;
    location / {
        set $pds http://pds:3000;
        proxy_pass $pds;
    }
}

# This stack's PLC, standing in for the real directory.
server {
    listen 443 ssl;
    server_name plc.directory;
    location / {
        set $plc http://plc:2582;
        proxy_pass $plc;
    }
}

# A client on the dev pod, at port 5480: the probe's client metadata and JWKS.
server {
    listen 443 ssl;
    server_name atmo.devnet.internal;
    location / {
        proxy_pass http://host.docker.internal:5480;
    }
}
