# The local devnet's page relays: included in the server for the bare
# DEVNET_DOMAIN in https/nginx.conf.template, where root and globe.json are set. Each relay is a fixed
# path to one service in the compose network, GET only. A variable upstream is looked up through
# Docker's DNS on each request, so a service that starts after nginx, or is recreated, is still found.
# The two extra account servers, the relay and TAP share the alpha's network namespace, so all of
# them are reached as pds:<port>.

proxy_connect_timeout 3s;
proxy_read_timeout 5s;
# These replace the http block's headers here, so the feed's websocket ones are repeated.
proxy_set_header Host $proxy_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
if ($request_method !~ ^(GET|HEAD)$) { return 405; }

set $pds http://pds;
set $plc http://plc:2582;
set $jetstream http://jetstream:6008;
set $slingshot http://slingshot-dns:8080;
set $maildev http://maildev:1080;
set $pdsls http://pdsls:8080;

location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}
location = /globe.json {
    default_type application/json;
    add_header Cache-Control "no-cache";
    alias /etc/nginx/devnet/globe.json;
}

# Health: each service's own check, or its front page where it has none.
location = /health/pds       { proxy_pass $pds:3010/xrpc/_health; }
location = /health/regular   { proxy_pass $pds:3020/xrpc/_health; }
location = /health/prod      { proxy_pass $pds:3030/xrpc/_health; }
location = /health/plc       { proxy_pass $plc/_health; }
location = /health/relay     { proxy_pass $pds:2470/xrpc/_health; }
location = /health/jetstream { proxy_pass $jetstream/; }
location = /health/slingshot { proxy_pass $slingshot/; }
location = /health/sync      { proxy_pass $pds:2480/health; }
location = /health/mail      { proxy_pass $maildev/api/healthz; }
location = /health/pdsls     { proxy_pass $pdsls/_health; }

# Accounts on each account server. The query string passes through.
location = /people/listRepos            { proxy_pass $pds:3010/xrpc/com.atproto.sync.listRepos$is_args$args; }
location = /people/describeRepo         { proxy_pass $pds:3010/xrpc/com.atproto.repo.describeRepo$is_args$args; }
location = /people/regular/listRepos    { proxy_pass $pds:3020/xrpc/com.atproto.sync.listRepos$is_args$args; }
location = /people/regular/describeRepo { proxy_pass $pds:3020/xrpc/com.atproto.repo.describeRepo$is_args$args; }
location = /people/prod/listRepos       { proxy_pass $pds:3030/xrpc/com.atproto.sync.listRepos$is_args$args; }
location = /people/prod/describeRepo    { proxy_pass $pds:3030/xrpc/com.atproto.repo.describeRepo$is_args$args; }

# The live feed: Jetstream's websocket, open as long as the page is.
location = /subscribe {
    proxy_read_timeout 1h;
    proxy_pass $jetstream/subscribe$is_args$args;
}

location / { return 404; }
