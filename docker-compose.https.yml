# Overlay: the whole spaces stack at https names, the way the real network looks, so an
# app built for the real network runs against the devnet with no devnet code. Stack it
# LAST, on all five spaces files, with a project name of your choosing:
#
#   docker compose -p <project> -f docker-compose.yml -f docker-compose.test.yml \
#     -f docker-compose.spaces.yml -f docker-compose.multi-pds.yml \
#     -f docker-compose.relay.yml -f docker-compose.https.yml up -d --wait
#
# scripts/https-up.sh does exactly that (DEVNET_PROJECT names the project), plus the
# certificates, the lexicon authority's second pass and data/devnet.env. Use it.
#
# Names, all answered by nginx on 127.0.0.1:443 with one leaf from data/https/
# (scripts/https-ca.sh), signed by a local CA that can vouch for nothing else:
#
#   alpha.devnet.test    *.devnet.test           pds          the spaces alpha, invites on
#   regular.devnet.test  *.regular.devnet.test   pds-regular  a current release
#   prod.devnet.test     *.prod.devnet.test      pds-prod     the build you run in prod
#   plc.directory                                plc          this stack's PLC
#   <name>.devnet.internal                       an app on this machine, at the port
#                                                scripts/https-app.sh recorded for <name>
#
# Each PDS's public URL, OAuth issuer and DID document endpoint is https://<its name>.
# Every PDS trusts the CA (NODE_EXTRA_CA_CERTS), and inside the compose network nginx
# also answers to the three PDS names, so the PDSes reach each other, the lexicon
# authority and an app's client metadata over TLS. The relay crawls them as wss://
# hosts. On the machine, the names resolve to 127.0.0.1 only for commands run under
# scripts/https-run, so every other program still reaches the real plc.directory.
#
# Published ports, all on 127.0.0.1: 443 (nginx), the PLC (DEVNET_PLC_PORT), Jetstream
# (DEVNET_JETSTREAM_PORT, DEVNET_JETSTREAM_METRICS_PORT) and maildev
# (DEVNET_MAILDEV_WEB_PORT, DEVNET_MAILDEV_SMTP_PORT). The PDS, relay, TAP and Postgres
# ports are not published: reach a PDS by its https name.

x-devnet-ca: &devnet-ca ./data/https/ca.crt:/https/ca.crt:ro
x-app-names: &app-names ./https/app-names.cjs:/https/app-names.cjs:ro
# Go reads every file in /etc/ssl/certs on top of its bundle, so the public roots stay.
x-go-ca: &go-ca ./data/https/ca.crt:/etc/ssl/certs/atproto-devnet-ca.pem:ro

x-https-pds-env: &https-pds-env
  # Every address a PDS fetches from here (nginx, the PLC, this machine) is an RFC 1918
  # one, which the SSRF-protected fetch would refuse.
  PDS_DISABLE_SSRF_PROTECTION: "true"
  NODE_EXTRA_CA_CERTS: /https/ca.crt
  # <name>.devnet.internal resolves to nginx inside each PDS (https/app-names.cjs).
  NODE_OPTIONS: --require /https/app-names.cjs

services:
  pds:
    environment:
      <<: *https-pds-env
      PDS_HOSTNAME: alpha.devnet.test
      # Explicit: the default would be .alpha.devnet.test.
      PDS_SERVICE_HANDLE_DOMAINS: .devnet.test
      PDS_HANDLE_DOMAINS: .devnet.test
      # The public URL is https, so the alpha runs as it would on the real network.
      # ("false", not !reset: compose keeps a key an earlier overlay set.)
      PDS_DEV_MODE: "false"
    volumes:
      - *devnet-ca
      - *app-names
    ports: !reset []

  pds-regular:
    environment:
      <<: *https-pds-env
      PDS_HOSTNAME: regular.devnet.test
    volumes:
      - *devnet-ca
      - *app-names

  pds-prod:
    environment:
      <<: *https-pds-env
      PDS_HOSTNAME: prod.devnet.test
    volumes:
      - *devnet-ca
      - *app-names

  relay:
    # Its own tag, so an image built from an older relay/ patch is never reused.
    image: atproto-devnet-relay:https-${DEVNET_RELAY_INDIGO_COMMIT:-b2619d864df00a66455bd9f5f0c83c1ac13ad73d}
    environment:
      # Every host is a wss:// one now.
      RELAY_ALLOW_INSECURE_HOSTS: !reset null
    volumes:
      - *go-ca
    depends_on:
      nginx:
        condition: service_healthy

  relay-init:
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      # Bare names are https/wss hosts to the relay.
      RELAY_HOSTS: alpha.devnet.test regular.devnet.test prod.devnet.test

  # Resync fetches repos through an SSRF-safe transport, which refuses nginx's address,
  # so TAP follows the relay's stream but cannot resync a repo here.
  tap:
    volumes:
      - *go-ca

  postgres:
    # The PLC's database, named, so a `down` without -v keeps every DID.
    volumes:
      - plc-db:/var/lib/postgresql/data
    ports: !reset []

  plc:
    ports: !override
      - "127.0.0.1:${DEVNET_PLC_PORT:-2582}:2582"

  jetstream:
    ports: !override
      - "127.0.0.1:${DEVNET_JETSTREAM_PORT:-6008}:6008"
      - "127.0.0.1:${DEVNET_JETSTREAM_METRICS_PORT:-6009}:6009"

  maildev:
    ports: !override
      - "127.0.0.1:${DEVNET_MAILDEV_WEB_PORT:-1081}:1080"
      - "127.0.0.1:${DEVNET_MAILDEV_SMTP_PORT:-1026}:1025"

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      pds:
        condition: service_healthy
      plc:
        condition: service_healthy
    ports:
      - "127.0.0.1:443:443"
    extra_hosts:
      # This machine, where an app registered with scripts/https-app.sh listens.
      - host.docker.internal:host-gateway
    volumes:
      - ./https/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/https/leaf.crt:/etc/nginx/https/leaf.crt:ro
      - ./data/https/leaf.key:/etc/nginx/https/leaf.key:ro
      # The app routes scripts/https-app.sh writes (a directory, so a rewrite shows up).
      - ./data/https/nginx:/etc/nginx/devnet:ro
    networks:
      atproto-devnet:
        aliases:
          - alpha.devnet.test
          - regular.devnet.test
          - prod.devnet.test
    healthcheck:
      test: ["CMD", "nginx", "-t", "-q"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  plc-db:
