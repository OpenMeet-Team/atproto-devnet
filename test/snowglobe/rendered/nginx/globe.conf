# Written by bin/snowglobe.mjs render from atmo.yml; render again instead of editing.

# alpha: the PDS and every handle under local.snowglobe.at.
server {
    listen 443 ssl;
    server_name alpha.local.snowglobe.at *.local.snowglobe.at;
    location / {
        set $upstream http://pds-alpha:3000;
        proxy_pass $upstream;
    }
}

