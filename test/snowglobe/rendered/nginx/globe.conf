# Written by bin/snowglobe.mjs render from snowglobe.default.yml; render again instead of editing.

# alpha: the PDS and every handle under devnet.test.
server {
    listen 443 ssl;
    server_name alpha.devnet.test *.devnet.test;
    location / {
        set $upstream http://pds-alpha:3000;
        proxy_pass $upstream;
    }
}

