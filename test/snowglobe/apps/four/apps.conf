# Written by snowglobe app from https/apps; rerun it instead of editing.
upstream snowglobe_app_atmo { server host.docker.internal:5173; }
upstream snowglobe_app_probe { server host.docker.internal:5480; }

# Handles under ev.four.test go to atmo.
server {
    listen 443 ssl;
    server_name *.ev.four.test;
    location / {
        proxy_pass http://snowglobe_app_atmo;
    }
}
